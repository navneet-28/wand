[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wand-platform"
version = "0.1.0"
description = "A small local platform for building data-backed apps with coding agents"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
wand = "wand.cli:main"

[tool.setuptools]
packages = ["wand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
